{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIT Indore Chatbot - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
</head>
<body class="app-bg">
    <div class="page-wrap">
        <main class="page-main" style="justify-content: center; flex: 1;">
            <div class="card narrow card-center">
                <div class="logo-badge">
                    <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path d="M24 12L38 18.5L24 25L10 18.5L24 12Z" fill="#fff"/>
                        <path d="M17 21.5V28C17 28 19.8 31 24 31C28.2 31 31 28 31 28V21.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1 class="page-title">Welcome back</h1>
                <p class="page-subtitle">Sign in to IITI-GPT to continue.</p>

                {% if messages %}
                    {% for message in messages %}
                        <p class="{{ message.tags }}">{{ message }}</p>
                    {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="field">
                        <label for="roll_number">Roll Number</label>
                        <input type="text" id="roll_number" name="roll_number" placeholder="e.g., 220001234" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </form>

                <p class="foot-note">Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
            </div>
        </main>
        <footer class="app-footer">Built for the IIT Indore community 💙</footer>
    </div>
</body>
</html>
