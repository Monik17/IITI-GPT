{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIT Indore Chatbot - Navigation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
</head>
<body class="app-bg">
    <div class="page-wrap">
        {% include 'navigation/_topbar.html' %}

        <main class="page-main">
            <div class="card medium card-center">
                <div class="logo-badge">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#fff"/>
                        <circle cx="12" cy="9" r="2.5" fill="#2f5fe0"/>
                    </svg>
                </div>
                <h1 class="page-title">Campus Navigation</h1>
                <p class="page-subtitle">Enter two campus locations to get a walking map between them.</p>

                <form id="nav-form">
                    <div class="field">
                        <label for="start">Start Location</label>
                        <input type="text" id="start" name="start" placeholder="e.g., VSB Hostel" required>
                    </div>
                    <div class="field">
                        <label for="end">End Location</label>
                        <input type="text" id="end" name="end" placeholder="e.g., LRC" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Get Map</button>
                </form>

                <div id="error"></div>
                <iframe id="map-frame" class="map-frame" src=""></iframe>
            </div>
        </main>

        <footer class="app-footer">Built for the IIT Indore community 💙</footer>
    </div>

    <script>
        document.getElementById('nav-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const start = document.getElementById('start').value.trim();
            const end = document.getElementById('end').value.trim();
            const errorDiv = document.getElementById('error');
            const mapFrame = document.getElementById('map-frame');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            errorDiv.innerHTML = '';
            mapFrame.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Finding route...';

            try {
                const response = await fetch('/navigation/get_map/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ start, end })
                });
                const data = await response.json();

                if (data.error) {
                    errorDiv.innerHTML = `<p class="error">${data.error}</p>`;
                } else {
                    mapFrame.src = data.map_url;
                    mapFrame.style.display = 'block';
                }
            } catch (err) {
                errorDiv.innerHTML = '<p class="error">An error occurred. Please try again.</p>';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Get Map';
            }
        });
    </script>
</body>
</html>
